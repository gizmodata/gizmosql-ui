name: Build

on:
  workflow_call:
    inputs:
      retention-days:
        description: 'Number of days to retain artifacts'
        required: false
        default: 1
        type: number
      run-lint:
        description: 'Whether to run linting'
        required: false
        default: true
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: gizmosql-ui-linux-x64
            build-output: dist/gizmosql-ui
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: gizmosql-ui-linux-arm64
            build-output: dist/gizmosql-ui
          - os: macos-latest
            target: macos
            artifact: gizmosql-ui-macos-arm64
            build-output: dist/gizmosql-ui
          - os: windows-latest
            target: windows
            artifact: gizmosql-ui-win-x64.exe
            build-output: dist/gizmosql-ui.exe
          # windows-arm64 is temporarily dropped: the ADBC Node driver
          # manager (@apache-arrow/adbc-driver-manager) ships no
          # win32-arm64 native addon yet, so the 2.0 GizmoSQL client
          # cannot run there. Windows-on-ARM users run the x64 build
          # under Windows emulation. Re-add once upstream publishes a
          # win32-arm64 package (requested upstream).

    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use hoisted node_modules layout (Windows)
        if: ${{ startsWith(matrix.target, 'windows') }}
        shell: bash
        # pnpm 11 reads settings from pnpm-workspace.yaml, not .npmrc
        run: |
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        if: ${{ !startsWith(matrix.target, 'windows') }}
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: pnpm lint
        continue-on-error: true

      - name: Package binary for ${{ matrix.target }}
        shell: bash
        run: pnpm package:${{ matrix.target }}

      - name: Smoke test packed binary (release gate)
        shell: bash
        run: |
          # Run the actual packaged executable and prove the ADBC client
          # stack loads inside it — the class of failure a green
          # `next build` cannot catch (pkg snapshot vs ESM/native deps).
          BIN="${{ matrix.build-output }}"
          chmod +x "$BIN" || true
          PORT=3999 "./$BIN" > smoke.log 2>&1 &
          BIN_PID=$!
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf "http://localhost:3999/api/health/driver" > health.json 2>/dev/null; then
              break
            fi
          done
          cat smoke.log || true
          cat health.json || (echo "health endpoint never responded" && kill $BIN_PID && exit 1)
          python3 -c "import json; d=json.load(open('health.json')); assert d.get('ok') is True, d" \
            || { kill $BIN_PID; exit 1; }
          echo "PACKED BINARY DRIVER HEALTH: OK"
          kill $BIN_PID || true

      - name: Full query smoke against live GizmoSQL (linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          docker run --name smoke-gizmosql --detach --init \
            --publish 31337:31337 --env TLS_ENABLED=1 \
            --env GIZMOSQL_USERNAME=smoke --env GIZMOSQL_PASSWORD=smokepass \
            gizmodata/gizmosql:latest
          sleep 10
          BIN="${{ matrix.build-output }}"
          PORT=3998 "./$BIN" > smoke2.log 2>&1 &
          BIN_PID=$!
          sleep 5
          RESP=$(curl -sf -X POST http://localhost:3998/api/connect \
            -H 'content-type: application/json' \
            -d '{"host":"localhost","port":31337,"username":"smoke","password":"smokepass","skipTlsVerify":true}')
          echo "connect response: $RESP"
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); assert not d.get('error'), d"
          echo "PACKED BINARY LIVE CONNECT: OK"
          kill $BIN_PID || true
          docker rm -f smoke-gizmosql

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.build-output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.build-output }}
          retention-days: ${{ inputs.retention-days }}
