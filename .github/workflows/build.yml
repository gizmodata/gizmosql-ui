name: Build

on:
  workflow_call:
    inputs:
      retention-days:
        description: 'Number of days to retain artifacts'
        required: false
        default: 1
        type: number
      run-lint:
        description: 'Whether to run linting'
        required: false
        default: true
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: gizmosql-ui-linux-x64
            build-output: dist/gizmosql-ui
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: gizmosql-ui-linux-arm64
            build-output: dist/gizmosql-ui
          - os: macos-latest
            target: macos
            artifact: gizmosql-ui-macos-arm64
            build-output: dist/gizmosql-ui
          - os: windows-latest
            target: windows
            artifact: gizmosql-ui-win-x64.exe
            build-output: dist/gizmosql-ui.exe
          # windows-arm64 is temporarily dropped: the ADBC Node driver
          # manager (@apache-arrow/adbc-driver-manager) ships no
          # win32-arm64 native addon yet, so the 2.0 GizmoSQL client
          # cannot run there. Windows-on-ARM users run the x64 build
          # under Windows emulation. Re-add once upstream publishes a
          # win32-arm64 package (requested upstream).

    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use hoisted node_modules layout (Windows)
        if: ${{ startsWith(matrix.target, 'windows') }}
        shell: bash
        # pnpm 11 reads settings from pnpm-workspace.yaml, not .npmrc
        run: |
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        if: ${{ !startsWith(matrix.target, 'windows') }}
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: pnpm lint
        continue-on-error: true

      - name: Package binary for ${{ matrix.target }}
        shell: bash
        run: pnpm package:${{ matrix.target }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.build-output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.build-output }}
          retention-days: ${{ inputs.retention-days }}
