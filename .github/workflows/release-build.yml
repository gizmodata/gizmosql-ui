name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      retention-days: 1
      run-lint: false

  sign-macos:
    name: Sign macOS (arm64)
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download unsigned binary
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-macos-arm64
          path: unsigned

      - name: Sign and notarize macOS binary
        uses: toitlang/action-macos-sign-notarize@v1.2.1
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          username: ${{ secrets.APPLE_ID_USERNAME }}
          password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-path: unsigned/gizmosql-ui
          entitlements-path: macos/entitlements.plist

      - name: Upload signed binary
        uses: actions/upload-artifact@v7
        with:
          name: gizmosql-ui-macos-arm64-signed
          path: unsigned/gizmosql-ui
          if-no-files-found: error

  sign-windows:
    name: Sign Windows (x64)
    needs: build
    runs-on: windows-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download unsigned executable
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-win-x64.exe
          path: unsigned

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Sign executable
        run: |
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --azure-key-vault-managed-identity `
            --timestamp-rfc3161 http://timestamp.digicert.com `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            --verbose `
            unsigned\gizmosql-ui.exe

      - name: Upload signed executable
        uses: actions/upload-artifact@v7
        with:
          name: gizmosql-ui-win-x64-signed
          path: unsigned/gizmosql-ui.exe
          if-no-files-found: error

  build-msi:
    name: Build MSI (x64)
    needs: sign-windows
    runs-on: windows-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download signed executable
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-win-x64-signed
          path: installer/bin

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add WixToolset.UI.wixext/6.0.2

      - name: Convert logo to BMP
        run: |
          Add-Type -AssemblyName System.Drawing
          $logo = [System.Drawing.Image]::FromFile("${{ github.workspace }}\installer\gizmosql_logo.png")
          # Banner (493x58)
          $banner = New-Object System.Drawing.Bitmap(493, 58)
          $g = [System.Drawing.Graphics]::FromImage($banner)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawImage($logo, 10, 4, 200, 50)
          $g.Dispose()
          $banner.Save("${{ github.workspace }}\installer\banner.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          # Dialog (493x312)
          $dialog = New-Object System.Drawing.Bitmap(493, 312)
          $g = [System.Drawing.Graphics]::FromImage($dialog)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawImage($logo, 20, 20, 300, 75)
          $g.Dispose()
          $dialog.Save("${{ github.workspace }}\installer\dialog.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $logo.Dispose()

      - name: Create license.rtf
        run: |
          $license = Get-Content "${{ github.workspace }}\LICENSE" -Raw
          $rtf = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Consolas;}}\f0\fs18 " + ($license -replace "`n", "\par ") + "}"
          Set-Content -Path "${{ github.workspace }}\installer\license.rtf" -Value $rtf

      - name: Build MSI
        run: |
          wix build `
            "${{ github.workspace }}\installer\GizmoSQLUI.wxs" `
            -arch x64 `
            -b BinDir="${{ github.workspace }}\installer\bin" `
            -b "${{ github.workspace }}\installer" `
            -o "${{ github.workspace }}\installer\GizmoSQL-UI-x64.msi" `
            -ext WixToolset.UI.wixext

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Sign MSI
        run: |
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --azure-key-vault-managed-identity `
            --timestamp-rfc3161 http://timestamp.digicert.com `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            --verbose `
            "${{ github.workspace }}\installer\GizmoSQL-UI-x64.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: gizmosql-ui-win-x64-msi
          path: installer/GizmoSQL-UI-x64.msi
          if-no-files-found: error

  release:
    needs: [build, sign-macos, sign-windows, build-msi]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-linux-x64
          path: artifacts/gizmosql-ui-linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-linux-arm64
          path: artifacts/gizmosql-ui-linux-arm64

      - name: Download signed macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-macos-arm64-signed
          path: artifacts/gizmosql-ui-macos-arm64-signed

      - name: Download signed Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-win-x64-signed
          path: artifacts/gizmosql-ui-win-x64-signed

      - name: Download MSI artifact
        uses: actions/download-artifact@v8
        with:
          name: gizmosql-ui-win-x64-msi
          path: artifacts/gizmosql-ui-win-x64-msi

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/gizmosql-ui-linux-x64/gizmosql-ui release/gizmosql-ui-linux-x64
          cp artifacts/gizmosql-ui-linux-arm64/gizmosql-ui release/gizmosql-ui-linux-arm64
          cp artifacts/gizmosql-ui-macos-arm64-signed/gizmosql-ui release/gizmosql-ui-macos-arm64
          cp artifacts/gizmosql-ui-win-x64-signed/gizmosql-ui.exe release/gizmosql-ui-win-x64.exe
          cp artifacts/gizmosql-ui-win-x64-msi/GizmoSQL-UI-x64.msi release/GizmoSQL-UI-x64.msi
          cd release
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt

      - name: Extract changelog section for release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            release/gizmosql-ui-linux-x64
            release/gizmosql-ui-linux-arm64
            release/gizmosql-ui-macos-arm64
            release/gizmosql-ui-win-x64.exe
            release/GizmoSQL-UI-x64.msi
            release/checksums.txt

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Extract version from tag (removes 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}

          # Get SHA256 of all binaries
          SHA256_MACOS_ARM64=$(sha256sum release/gizmosql-ui-macos-arm64 | cut -d' ' -f1)
          SHA256_LINUX_X64=$(sha256sum release/gizmosql-ui-linux-x64 | cut -d' ' -f1)
          SHA256_LINUX_ARM64=$(sha256sum release/gizmosql-ui-linux-arm64 | cut -d' ' -f1)

          # Clone the tap repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/gizmodata/homebrew-tap.git tap
          cd tap

          # Update the formula using printf to avoid heredoc issues
          printf '%s\n' \
            'class GizmosqlUi < Formula' \
            '  desc "Web-based SQL interface for GizmoSQL servers"' \
            '  homepage "https://github.com/gizmodata/gizmosql-ui"' \
            "  version \"${VERSION}\"" \
            '  license "Apache-2.0"' \
            '' \
            '  on_macos do' \
            '    if Hardware::CPU.arm?' \
            '      url "https://github.com/gizmodata/gizmosql-ui/releases/download/v#{version}/gizmosql-ui-macos-arm64"' \
            "      sha256 \"${SHA256_MACOS_ARM64}\"" \
            '' \
            '      def install' \
            '        bin.install "gizmosql-ui-macos-arm64" => "gizmosql-ui"' \
            '      end' \
            '    end' \
            '  end' \
            '' \
            '  on_linux do' \
            '    if Hardware::CPU.arm?' \
            '      url "https://github.com/gizmodata/gizmosql-ui/releases/download/v#{version}/gizmosql-ui-linux-arm64"' \
            "      sha256 \"${SHA256_LINUX_ARM64}\"" \
            '' \
            '      def install' \
            '        bin.install "gizmosql-ui-linux-arm64" => "gizmosql-ui"' \
            '      end' \
            '    elsif Hardware::CPU.intel?' \
            '      url "https://github.com/gizmodata/gizmosql-ui/releases/download/v#{version}/gizmosql-ui-linux-x64"' \
            "      sha256 \"${SHA256_LINUX_X64}\"" \
            '' \
            '      def install' \
            '        bin.install "gizmosql-ui-linux-x64" => "gizmosql-ui"' \
            '      end' \
            '    end' \
            '  end' \
            '' \
            '  def caveats' \
            '    <<~EOS' \
            '      GizmoSQL UI starts a local web server and opens your browser.' \
            '' \
            '      To start GizmoSQL UI:' \
            '        gizmosql-ui' \
            '' \
            '      The server runs at http://localhost:3000 by default.' \
            '      Set PORT environment variable to use a different port.' \
            '    EOS' \
            '  end' \
            '' \
            '  test do' \
            '    assert_match "GizmoSQL", shell_output("#{bin}/gizmosql-ui --help 2>&1", 1)' \
            '  end' \
            'end' > Formula/gizmosql-ui.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gizmosql-ui.rb
          git commit -m "Update gizmosql-ui to ${VERSION}"
          git push
