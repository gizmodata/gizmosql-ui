packages:
  - "."

# Build/postinstall scripts allowed to run (pnpm blocks them by
# default): the GizmoSQL client downloads its native ADBC driver
# library at install time, and the ADBC driver manager sets up its
# native addon. (esbuild/sharp remain blocked as before — they have
# prebuilt fallbacks.)
allowBuilds:
  "@gizmodata/gizmosql-client": true
  "@apache-arrow/adbc-driver-manager": true
  esbuild: set this to true or false
  sharp: set this to true or false

# The 24h minimumReleaseAge supply-chain guard stays active for
# third-party packages, but first-party @gizmodata releases are exempt —
# we release and consume them same-day by design.
minimumReleaseAgeExclude:
  - "@gizmodata/*"
